# NPM Release - npm trusted publishing (OIDC), no long-lived npm token.
# Prerequisite on npmjs.com: package settings > Trusted publisher > GitHub Actions
#   organization/user: inspired-technologies, repository: signalk-openmeteo-plugin, workflow: npm-release.yml
name: npm-release

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  publish:
    name: Release to NPM
    runs-on: ubuntu-latest      # trusted publishing requires GitHub-hosted runners
    permissions:
      contents: write           # create the GitHub release
      id-token: write           # OIDC token for npm trusted publishing
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      # Works for the first publish too - unlike a lookup of package.json on unpkg.
      - name: Check if version has been updated
        id: check
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          published=$(npm view "$name@$version" version 2>/dev/null || true)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$published" = "$version" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Non release change - $name@$version is already published"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "New version $name@$version"
          fi

      - name: Install and test
        if: steps.check.outputs.changed == 'true'
        run: |
          npm install -g npm@11
          npm install
          npm test

      - name: Publish Package
        if: steps.check.outputs.changed == 'true'
        run: npm publish --access public

      - name: Create Release
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          gh release create "$VERSION" --target "$GITHUB_SHA" \
            --title "Release $VERSION" \
            --notes "New release to NPM - openmeteo-signalk@$VERSION"
